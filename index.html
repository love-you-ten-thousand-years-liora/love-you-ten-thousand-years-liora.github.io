<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#030d12">
<title>Love You Ten Thousand Years · Liora</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#030d12;color:#effff6;font-family:"Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.top{position:fixed;top:30px;left:32px;font:11px Consolas,monospace;letter-spacing:3px;color:#95b5ae}.top b{color:#80f6bd;font-weight:normal}.message{position:fixed;bottom:12%;width:100%;text-align:center;pointer-events:none;opacity:0;transform:translateY(15px);transition:opacity 2s,transform 2s}.message.show{opacity:1;transform:translateY(0)}h1{margin:0 0 12px;font-family:Georgia,serif;font-size:clamp(34px,6vw,66px);font-weight:normal;letter-spacing:2px;text-shadow:0 0 28px #6affc755}.wish{color:#d4eee2;letter-spacing:7px;font-size:clamp(13px,2.5vw,17px)}.foot{position:fixed;bottom:26px;left:0;width:100%;display:flex;justify-content:center;align-items:center;gap:22px;font:11px Consolas,monospace;color:#72988d}button{font:12px "Microsoft YaHei",sans-serif;border:1px solid #86d5ae45;background:#122a2588;color:#c9e9db;border-radius:30px;padding:10px 20px;cursor:pointer}button:hover{background:#254c3e}button:focus-visible{outline:2px solid #b8ffd7;outline-offset:4px}@media(max-width:500px){.top{top:22px;left:20px;font-size:9px}.message{bottom:15%}.wish{letter-spacing:4px}.foot span{display:none}}
.names{position:fixed;top:8%;left:5%;width:90%;text-align:center;pointer-events:none;perspective:650px;opacity:0;transition:opacity 2s}.names.show{opacity:1}.names-inner{display:inline-block;font:bold clamp(28px,6.8vw,74px) Georgia,serif;letter-spacing:2px;transform:rotateX(24deg) rotateY(-13deg) rotateZ(-4deg);color:#ddffed;text-shadow:1px 2px 0 #508b75,2px 4px 0 #285d4c,3px 6px 0 #174132,0 0 30px #82ffc477}.names em{font-style:normal;color:#ffe6b2;text-shadow:1px 2px 0 #9c7748,2px 4px 0 #665031,3px 6px 0 #3b3421,0 0 32px #ffc77866}.names small{display:inline-block;font-family:"Segoe Script","Brush Script MT",cursive;font-style:italic;font-weight:400;font-size:.48em;letter-spacing:-2px;color:#f6c7ca;vertical-align:middle;padding:0 .25em;text-shadow:0 0 18px #f8aabb66;transform:rotate(-7deg)}@media(prefers-reduced-motion:reduce){.names,.message{transition:none}}
html,body{height:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
.foot{bottom:calc(22px + env(safe-area-inset-bottom));flex-wrap:wrap;gap:12px;padding:0 14px}
.top{padding-top:env(safe-area-inset-top)}
.shot{position:fixed;inset:0;background:#030d12f2;display:none;place-items:center;z-index:9;padding:14px}
.shot.on{display:grid}
.shot img{max-width:100%;max-height:82vh;border-radius:12px;box-shadow:0 0 40px #6affc744}
.shot p{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:0;width:100%;text-align:center;font:12px "Microsoft YaHei",sans-serif;color:#a9c9bd;margin:0;pointer-events:none}
@media(max-width:560px){.foot{bottom:calc(14px + env(safe-area-inset-bottom))}button{padding:8px 14px;font-size:11px}.message{bottom:13%}}
</style>
</head>
<body>
<canvas id="scene" aria-label="代码字符逐渐汇聚成一棵旋转的绿色圣诞树，金色灯带环绕，雪花缓缓飘落" role="img"></canvas>
<div class="top"><b>DEC 25</b> &nbsp; / &nbsp; A LITTLE MAGIC, IN CODE</div>
<div class="names" id="names"><div class="names-inner">Liora <small>love</small> <em>shenyi</em></div></div>
<div class="message" id="message"><h1>Merry Christmas</h1><div class="wish">圣诞快乐 · 愿你所愿皆如愿</div></div>
<div class="foot"><span>const wish = "happiness, always";</span><button id="replay" type="button">↻ 再看一次魔法</button><button id="save" type="button">存一张图</button></div>
<div class="shot" id="shot"><img id="shotimg" alt="圣诞树，长按可保存"><p>长按图片保存 · 也可以直接发给他</p></div>
<script>
(()=>{
 'use strict';
 const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),message=document.getElementById('message'),names=document.getElementById('names');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const small=matchMedia('(max-width:600px)').matches||(navigator.hardwareConcurrency||8)<=4;
 const PCOUNT=small?420:720,SNOW=small?60:100,GOLD=small?150:230,BAUBLE=small?24:32;
 let w,h,dpr,start=performance.now(),last=start;
 const chars=['0','1','{','}','<','>','/','*',';','+','=','Liora','shenyi','Liora','shenyi'];
 const random=(a,b)=>a+Math.random()*(b-a);
 const particles=Array.from({length:PCOUNT},(_,i)=>{
   const y=Math.pow(Math.random(),.72),angle=random(0,Math.PI*2);
   return {y,angle,r:Math.sqrt(Math.random()),sx:Math.random(),sy:Math.random(),delay:random(0,1.5),char:i%24===0?'Liora':i%24===12?'shenyi':chars[i%11],seed:random(0,9),size:random(6,9)};
 });
 const snow=Array.from({length:SNOW},()=>({x:Math.random(),y:Math.random(),s:random(.5,1.8),v:random(.012,.045),a:random(.15,.55)}));
 function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,small?1.6:2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
 addEventListener('resize',resize);resize();
 document.getElementById('replay').addEventListener('click',()=>{start=performance.now();message.classList.remove('show');names.classList.remove('show');});
 function star(x,y,r,t){
   ctx.save();ctx.translate(x,y);ctx.shadowColor='#ffe6a2';ctx.shadowBlur=25+Math.sin(t*2)*8;ctx.fillStyle='#fff1bd';ctx.beginPath();
   for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.43:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();ctx.restore();
 }
 function frame(now){
   const elapsed=(now-start)/1000,t=reduced?12:elapsed,rotation=reduced?0:Math.max(0,t-3)*.19,dt=Math.min((now-last)/1000,.05);last=now;
   ctx.clearRect(0,0,w,h);
   const cx=w/2,top=h*.27,th=Math.min(h*.44,w*.96),base=top+th,radius=Math.min(w*.33,th*.49);
   const bg=ctx.createRadialGradient(cx,top+th*.6,0,cx,top+th*.6,Math.max(w,h)*.62);bg.addColorStop(0,'#0a2926');bg.addColorStop(.55,'#051518');bg.addColorStop(1,'#030a10');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
   for(const s of snow){if(!reduced){s.y=(s.y+dt*s.v)%1;s.x=(s.x+Math.sin(now*.0002+s.s)*dt*.007+1)%1;}ctx.fillStyle=`rgba(200,235,224,${s.a})`;ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.s,0,Math.PI*2);ctx.fill();}
   const progress=Math.min(1,t/6),ground=ctx.createRadialGradient(cx,base+12,0,cx,base+12,radius*1.3);ground.addColorStop(0,`rgba(75,218,153,${.18*progress})`);ground.addColorStop(1,'rgba(30,100,80,0)');ctx.save();ctx.translate(cx,base+12);ctx.scale(1,.16);ctx.fillStyle=ground;ctx.translate(-cx,-base-12);ctx.fillRect(cx-radius*1.4,base-radius*1.4,radius*2.8,radius*2.8);ctx.restore();
   const points=[];
   for(const p of particles){
     const a=p.angle+rotation,r=radius*p.y*p.r*(.89+.11*Math.sin(p.y*33));
     const z=Math.sin(a)*r,x=cx+Math.cos(a)*r,y=top+p.y*th+z*.12;
     const q=Math.max(0,Math.min(1,(t-1-p.delay)/3.8)),ease=q*q*(3-2*q);
     points.push({x:p.sx*w+(x-p.sx*w)*ease,y:p.sy*h+(y-p.sy*h)*ease,z,p,ease});
   }
   points.sort((a,b)=>a.z-b.z);
   ctx.textAlign='center';ctx.textBaseline='middle';
   for(const o of points){
     const light=(o.z/radius+1)/2,isName=o.p.char==='Liora'||o.p.char==='shenyi';
     const depth=1/(1-o.z/(radius*2.9)),scale=1+(depth-1)*o.ease;
     ctx.save();ctx.translate(o.x,o.y);ctx.scale(scale,scale);
     if(isName){ctx.transform(1,-.14*o.ease,.1*o.ease,1,0,0);}
     ctx.font=`${isName?'500 ':''}${isName?10:o.p.size}px Consolas,monospace`;
     ctx.fillStyle=isName?(o.p.char==='Liora'?`rgba(182,255,216,${.16+light*.54})`:`rgba(255,221,163,${.16+light*.54})`):`rgba(95,210,157,${.12+light*.42})`;
     ctx.fillText(o.p.char,0,0);ctx.restore();
   }
   if(t>3){const fade=Math.min(1,(t-3)/2);ctx.save();ctx.globalAlpha=fade;
     for(let i=0;i<GOLD;i++){const p=i/GOLD,a=p*Math.PI*2*4.5+rotation,r=radius*p*1.01,z=Math.sin(a)*r;const x=cx+Math.cos(a)*r,y=top+p*th+z*.12;ctx.fillStyle=z>0?'#ffe5a0':'#8a8754';ctx.shadowColor='#ffc668';ctx.shadowBlur=z>0?12:0;ctx.beginPath();ctx.arc(x,y,z>0?1.7:1,0,Math.PI*2);ctx.fill();}
     for(let i=0;i<BAUBLE;i++){const p=.18+(i/BAUBLE)*.8,a=i*2.4+rotation,z=Math.sin(a);if(z<-.2)continue;ctx.fillStyle=i%3===0?'#ffa5ab':'#fff0bf';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(cx+Math.cos(a)*radius*p,top+p*th+z*radius*p*.12,2.2+Math.sin(t*2+i)*.7,0,Math.PI*2);ctx.fill();}
     ctx.restore();star(cx,top-12,Math.min(19,w*.045),reduced?0:t);
   }
   if(t>5.5){message.classList.add('show');names.classList.add('show');}
   requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
 document.getElementById('save').addEventListener('click',()=>{
  const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;
  const g=c.getContext('2d');g.drawImage(canvas,0,0);
  const W=c.width,H=c.height;g.textAlign='center';g.textBaseline='middle';
  g.font=Math.round(W*.05)+'px Georgia,serif';g.fillStyle='#effff6';g.shadowColor='#6affc7';g.shadowBlur=W*.012;g.fillText('Merry Christmas',W/2,H*.775);
  g.shadowBlur=0;g.font=Math.round(W*.019)+'px "Microsoft YaHei",sans-serif';g.fillStyle='#d4eee2';g.fillText('圣诞快乐 · 愿你所愿皆如愿',W/2,H*.845);
  g.font=Math.round(W*.019)+'px Georgia,serif';g.fillStyle='#95b5ae';g.fillText('Liora love shenyi',W/2,H*.9);
  document.getElementById('shotimg').src=c.toDataURL('image/png');
  document.getElementById('shot').classList.add('on');
 });
 document.getElementById('shot').addEventListener('click',e=>{if(e.target.id!=='shotimg')e.currentTarget.classList.remove('on');});
})();
</script>
</body>
</html>
