<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0512">
<link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=Great+Vibes&family=Satisfy&family=Allura&family=Cormorant+Garamond:ital,wght@1,600&display=swap">
<title>Love You Ten Thousand Years · Liora</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#1a0512;color:#ffe8f2;font-family:"Microsoft YaHei",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.top{position:fixed;top:30px;left:32px;font:11px Consolas,monospace;letter-spacing:3px;color:#d7a3bb}.top b{color:#ff9ecb;font-weight:normal}.message{position:fixed;bottom:12%;width:100%;text-align:center;pointer-events:none;opacity:0;transform:translateY(15px);transition:opacity 2s,transform 2s}.message.show{opacity:1;transform:translateY(0)}h1{margin:0 0 12px;font-family:'Great Vibes','Snell Roundhand','Apple Chancery','Brush Script MT','Segoe Script',cursive;font-size:clamp(44px,8.5vw,86px);font-weight:normal;letter-spacing:2px;text-shadow:0 0 28px #ff8ec255}.wish{color:#ffd9e9;letter-spacing:7px;font-size:clamp(13px,2.5vw,17px)}.foot{position:fixed;bottom:26px;left:0;width:100%;display:flex;justify-content:center;align-items:center;gap:22px;font:11px Consolas,monospace;color:#c08aa4}button{font:12px "Microsoft YaHei",sans-serif;border:1px solid #ff9ecb45;background:#2a122488;color:#ffd9e9;border-radius:30px;padding:10px 20px;cursor:pointer}button:hover{background:#4a2040}button:focus-visible{outline:2px solid #ffc4de;outline-offset:4px}@media(max-width:500px){.top{top:22px;left:20px;font-size:9px}.message{bottom:15%}.wish{letter-spacing:4px}.foot span{display:none}}
.names{position:fixed;top:8%;left:5%;width:90%;text-align:center;pointer-events:none;perspective:650px;opacity:0;transition:opacity 2s}.names.show{opacity:1}.names-inner{display:inline-block;font:400 clamp(30px,7.4vw,82px) 'Satisfy','Segoe Script','Brush Script MT',cursive;letter-spacing:0;transform:rotateX(24deg) rotateY(-13deg) rotateZ(-4deg);color:#ffe4f1;text-shadow:1px 2px 0 #8b5074,2px 3px 0 #5d2849,0 0 26px #ff82c277}.names em{font-style:normal;font-family:'Allura','Mrs Saint Delafield',cursive;font-size:1.3em;letter-spacing:0;color:#ffe4f1;text-shadow:1px 2px 0 #8b5074,2px 3px 0 #5d2849,0 0 30px #ff82c266}.names small{display:inline-block;font-family:'Cormorant Garamond','EB Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:.56em;letter-spacing:0;color:#fdf1f6;vertical-align:middle;padding:0 .25em;text-shadow:0 0 18px #f8aabb66;transform:rotate(-7deg)}@media(prefers-reduced-motion:reduce){.names,.message{transition:none}}
html,body{height:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
.foot{bottom:calc(22px + env(safe-area-inset-bottom));flex-wrap:wrap;gap:12px;padding:0 14px}
.top{padding-top:env(safe-area-inset-top)}
.shot{position:fixed;inset:0;background:#1a0512f2;display:none;place-items:center;z-index:9;padding:14px}
.shot.on{display:grid}
.shot img{max-width:100%;max-height:82vh;border-radius:12px;box-shadow:0 0 40px #ff8ec244}
.shot p{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:0;width:100%;text-align:center;font:12px "Microsoft YaHei",sans-serif;color:#e0a8c0;margin:0;pointer-events:none}
@media(max-width:560px){.foot{bottom:calc(14px + env(safe-area-inset-bottom))}button{padding:8px 14px;font-size:11px}.message{bottom:13%}}
</style>
</head>
<body>
<canvas id="scene" aria-label="代码字符逐渐汇聚成一棵旋转的绿色圣诞树，金色灯带环绕，雪花缓缓飘落" role="img"></canvas>
<div class="top"><b>DEC 25</b> &nbsp; / &nbsp; A LITTLE MAGIC, IN CODE</div>
<div class="names" id="names"><div class="names-inner">Liora <small>love</small> <em>shenyi</em></div></div>
<div class="message" id="message"><h1>Merry Christmas</h1><div class="wish">圣诞快乐 · 愿你所愿皆如愿</div></div>
<div class="foot"><span>const wish = "happiness, always";</span><button id="replay" type="button">↻ 再看一次魔法</button><button id="save" type="button">存一张图</button></div>
<div class="shot" id="shot"><img id="shotimg" alt="圣诞树，长按可保存"><p>长按图片保存 · 也可以直接发给他</p></div>
<script>
(()=>{
 'use strict';
 const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),message=document.getElementById('message'),names=document.getElementById('names');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const small=matchMedia('(max-width:600px)').matches||(navigator.hardwareConcurrency||8)<=4;
 const PCOUNT=small?420:720,SNOW=small?120:190,GOLD=small?150:230,BAUBLE=small?24:32;
 let w,h,dpr,start=performance.now(),last=start;
 const chars=['0','1','{','}','<','>','/','*',';','+','=','Liora','shenyi','Liora','shenyi'];
 const random=(a,b)=>a+Math.random()*(b-a);
 const particles=Array.from({length:PCOUNT},(_,i)=>{
   const y=Math.pow(Math.random(),.72),angle=random(0,Math.PI*2);
   return {y,angle,r:Math.sqrt(Math.random()),sx:Math.random(),sy:Math.random(),delay:random(0,1.5),char:i%24===0?'Liora':i%24===12?'shenyi':chars[i%11],seed:random(0,9),size:random(6,9)};
 });
 const HPT=a=>[16*Math.pow(Math.sin(a),3),-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))-6];
  const HPOLY=Array.from({length:400},(_,i)=>HPT(i/400*Math.PI*2));
  const inHeart=(x,y)=>{let c=false;for(let i=0,j=HPOLY.length-1;i<HPOLY.length;j=i++){const xi=HPOLY[i][0],yi=HPOLY[i][1],xj=HPOLY[j][0],yj=HPOLY[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;};
  const topRing=(()=>{const N=small?9:11,M=600,smp=[],seg=[0];
    for(let i=0;i<M;i++)smp.push(HPT(i/M*Math.PI*2));
    for(let i=1;i<=M;i++)seg.push(seg[i-1]+Math.hypot(smp[i%M][0]-smp[i-1][0],smp[i%M][1]-smp[i-1][1]));
    const total=seg[M],out=[];
    for(let k=0;k<N;k++){const d=total*k/N;let i=1;while(seg[i]<d&&i<M)i++;const p1=smp[i%M],p2=smp[(i+1)%M];
      out.push({hx:p1[0],hy:p1[1],ang:Math.atan2(p2[1]-p1[1],p2[0]-p1[0]),sx:Math.random(),sy:Math.random(),delay:random(0,1.2),word:k%2?"shenyi":"Liora",size:random(6.4,7.4)});}
    return out;})();
  const topFill=(()=>{const want=small?260:380,gap=1.15,out=[],letters="Liorashenyi";let guard=0;
    while(out.length<want&&guard<want*60){guard++;const x=(Math.random()*2-1)*16.4,y=-18+Math.random()*30;
      if(!inHeart(x,y))continue;let ok=true;for(const q of out){if((q.hx-x)*(q.hx-x)+(q.hy-y)*(q.hy-y)<gap*gap){ok=false;break;}}
      if(ok)out.push({hx:x,hy:y,ch:letters[out.length%10],sx:Math.random(),sy:Math.random(),delay:random(0,1.3),size:random(3.4,4.4)});}
    return out;})();
 const snow=Array.from({length:SNOW},()=>({x:Math.random(),y:Math.random(),s:random(.9,2.7),v:random(.02,.075),a:random(.35,.9)}));
 function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,small?1.6:2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
 addEventListener('resize',resize);resize();
 document.getElementById('replay').addEventListener('click',()=>{start=performance.now();message.classList.remove('show');names.classList.remove('show');});
 function star(cx,top,t){
    const tr=Math.min(34,w*.075),tk=tr/16,cy=top-tr*.88;
    for(const o of topFill){
      const q=Math.max(0,Math.min(1,(t-1-o.delay)/3.8)),ease=q*q*(3-2*q);if(ease<=0)continue;
      const x=cx+o.hx*tk,y=cy+o.hy*tk;
      ctx.save();ctx.globalAlpha=ease*.72;ctx.translate(o.sx*w+(x-o.sx*w)*ease,o.sy*h+(y-o.sy*h)*ease);
      ctx.font="500 "+o.size+"px Consolas,monospace";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillStyle="rgba(255,205,228,.9)";ctx.fillText(o.ch,0,0);ctx.restore();
    }
    for(const o of topRing){
      const q=Math.max(0,Math.min(1,(t-1-o.delay)/3.8)),ease=q*q*(3-2*q);if(ease<=0)continue;
      const x=cx+o.hx*tk,y=cy+o.hy*tk;
      ctx.save();ctx.globalAlpha=ease;ctx.translate(o.sx*w+(x-o.sx*w)*ease,o.sy*h+(y-o.sy*h)*ease);
      ctx.rotate(Math.abs(o.ang)>Math.PI/2?o.ang+Math.PI:o.ang);
      ctx.shadowColor="#ff9ecb";ctx.shadowBlur=9;ctx.font="500 "+o.size+"px Consolas,monospace";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillStyle=o.word==="Liora"?"rgba(255,196,224,.97)":"rgba(255,232,200,.97)";
      ctx.fillText(o.word,0,0);ctx.restore();
    }
  }
 function frame(now){
   const elapsed=(now-start)/1000,t=reduced?12:elapsed,rotation=reduced?0:Math.max(0,t-3)*.19,dt=Math.min((now-last)/1000,.05);last=now;
   ctx.clearRect(0,0,w,h);
   const cx=w/2,top=h*.27,th=Math.min(h*.44,w*.96),base=top+th,radius=Math.min(w*.33,th*.49);
   const bg=ctx.createRadialGradient(cx,top+th*.6,0,cx,top+th*.6,Math.max(w,h)*.62);bg.addColorStop(0,'#2a0a1e');bg.addColorStop(.55,'#1a0612');bg.addColorStop(1,'#12030c');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
   for(const s of snow){if(!reduced){s.y=(s.y+dt*s.v)%1;s.x=(s.x+Math.sin(now*.0002+s.s)*dt*.007+1)%1;}ctx.fillStyle=`rgba(255,246,250,${s.a})`;ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.s,0,Math.PI*2);ctx.fill();}
   const progress=Math.min(1,t/6),ground=ctx.createRadialGradient(cx,base+12,0,cx,base+12,radius*1.3);ground.addColorStop(0,`rgba(255,120,180,${.18*progress})`);ground.addColorStop(1,'rgba(120,30,70,0)');ctx.save();ctx.translate(cx,base+12);ctx.scale(1,.16);ctx.fillStyle=ground;ctx.translate(-cx,-base-12);ctx.fillRect(cx-radius*1.4,base-radius*1.4,radius*2.8,radius*2.8);ctx.restore();
   const points=[];
   for(const p of particles){
     const a=p.angle+rotation,r=radius*p.y*p.r*(.89+.11*Math.sin(p.y*33));
     const z=Math.sin(a)*r,x=cx+Math.cos(a)*r,y=top+p.y*th+z*.12;
     const q=Math.max(0,Math.min(1,(t-1-p.delay)/3.8)),ease=q*q*(3-2*q);
     points.push({x:p.sx*w+(x-p.sx*w)*ease,y:p.sy*h+(y-p.sy*h)*ease,z,p,ease});
   }
   points.sort((a,b)=>a.z-b.z);
   ctx.textAlign='center';ctx.textBaseline='middle';
   for(const o of points){
     const light=(o.z/radius+1)/2,isName=o.p.char==='Liora'||o.p.char==='shenyi';
     const depth=1/(1-o.z/(radius*2.9)),scale=1+(depth-1)*o.ease;
     ctx.save();ctx.translate(o.x,o.y);ctx.scale(scale,scale);
     if(isName){ctx.transform(1,-.14*o.ease,.1*o.ease,1,0,0);}
     ctx.font=`${isName?'500 ':''}${isName?10:o.p.size}px Consolas,monospace`;
     ctx.fillStyle=isName?(o.p.char==='Liora'?`rgba(255,190,225,${.16+light*.54})`:`rgba(255,215,190,${.16+light*.54})`):`rgba(255,140,190,${.12+light*.42})`;
     ctx.fillText(o.p.char,0,0);ctx.restore();
   }
   if(t>3){const fade=Math.min(1,(t-3)/2);ctx.save();ctx.globalAlpha=fade;
     for(let i=0;i<GOLD;i++){const p=i/GOLD,a=p*Math.PI*2*4.5+rotation,r=radius*p*1.01,z=Math.sin(a)*r;const x=cx+Math.cos(a)*r,y=top+p*th+z*.12;ctx.fillStyle=z>0?'#ffd9a8':'#b06a8a';ctx.shadowColor='#ff9ecb';ctx.shadowBlur=z>0?12:0;ctx.beginPath();ctx.arc(x,y,z>0?1.7:1,0,Math.PI*2);ctx.fill();}
     for(let i=0;i<BAUBLE;i++){const p=.18+(i/BAUBLE)*.8,a=i*2.4+rotation,z=Math.sin(a);if(z<-.2)continue;ctx.fillStyle=i%3===0?'#ff8fb0':'#ffe9f2';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(cx+Math.cos(a)*radius*p,top+p*th+z*radius*p*.12,2.2+Math.sin(t*2+i)*.7,0,Math.PI*2);ctx.fill();}
     ctx.restore();star(cx,top,reduced?12:t);
   }
   if(t>5.5){message.classList.add('show');names.classList.add('show');}
   requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
 document.getElementById('save').addEventListener('click',()=>{
  const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;
  const g=c.getContext('2d');g.drawImage(canvas,0,0);
  const W=c.width,H=c.height;g.textAlign='center';g.textBaseline='middle';
  g.font=Math.round(W*.066)+'px "Great Vibes","Snell Roundhand","Brush Script MT",cursive';g.fillStyle='#ffe8f2';g.shadowColor='#ff8ec2';g.shadowBlur=W*.012;g.fillText('Merry Christmas',W/2,H*.775);
  g.shadowBlur=0;g.font=Math.round(W*.019)+'px "Microsoft YaHei",sans-serif';g.fillStyle='#ffd9e9';g.fillText('圣诞快乐 · 愿你所愿皆如愿',W/2,H*.845);
  g.font=Math.round(W*.026)+'px "Satisfy","Brush Script MT",cursive';g.fillStyle='#d7a3bb';g.fillText('Liora love shenyi',W/2,H*.9);
  document.getElementById('shotimg').src=c.toDataURL('image/png');
  document.getElementById('shot').classList.add('on');
 });
 document.getElementById('shot').addEventListener('click',e=>{if(e.target.id!=='shotimg')e.currentTarget.classList.remove('on');});
})();
</script>
</body>
</html>
